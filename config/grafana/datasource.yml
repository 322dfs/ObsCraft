# Grafana 数据源自动配置
# 作用：Grafana启动时自动添加Prometheus数据源，无需手动在UI配置
# 注意：此文件通过Grafana的provisioning机制自动加载
# uid固定为prometheus，仪表盘JSON中通过此uid引用数据源

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
    editable: true
