# Nginx Web服务器配置
# 作用：处理HTTP请求，产生access.log和error.log
# 3台Web服务器共用此配置文件，日志写入各自容器的 /var/log/nginx/
# 通过Docker volume挂载到宿主机的不同目录（data/logs/web-1, web-2, web-3）

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 自定义日志格式：IP + 时间 + 请求 + 状态码 + 响应大小 + Referer + UA + 响应时间
    # 消费者用正则解析这个格式
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" $request_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    server {
        listen 80;
        server_name localhost;

        # 正常页面
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # 模拟500错误，用于触发告警
        location /error {
            return 500;
        }

        # 模拟404错误，用于触发告警
        location /notfound {
            return 404;
        }

        # Nginx状态页，供Prometheus采集指标
        location /nginx_status {
            stub_status on;
            access_log off;
            allow all;
        }
    }
}
