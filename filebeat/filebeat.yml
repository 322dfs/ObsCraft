filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/nginx/access.log
    fields:
      source: nginx
      type: access
    fields_under_root: true

  - type: log
    enabled: true
    paths:
      - /var/log/nginx/error.log
    fields:
      source: nginx
      type: error
    fields_under_root: true

  - type: log
    enabled: true
    paths:
      - /var/log/webapp/app.log
    fields:
      source: webapp
      type: application
    fields_under_root: true

output.kafka:
  enabled: true
  hosts: ["kafka:9092"]
  topic: "logs"
  partition.round_robin:
    reachable_only: true
  required_acks: 1
  compression: gzip
  max_message_bytes: 1000000

logging:
  level: info
  to_files: true
  files:
    path: /var/log/filebeat
    name: filebeat.log
    keepfiles: 2
